spring:
  application:
    name: transport-logistics-modulith
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: h2
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    repair-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith

security:
  jwt:
    issuer: transport-logistics-modulith
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

app:
  notification:
    email:
      enabled: false
      mode: test
      provider: test
      from: noreply@localhost.test
      reply-to:
      connect-timeout: PT5S
      read-timeout: PT30S
      smtp:
        host: localhost
        port: 2525
        tls-mode: none
        authentication-required: false
        username:
        password:
