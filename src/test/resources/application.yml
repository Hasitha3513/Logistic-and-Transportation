spring:
  application:
    name: transport-logistics-modulith
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: postgres
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:transport_logistics}}
    username: ${DB_USERNAME:${POSTGRES_USER:transport_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:transport_app_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    open-in-view: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    repair-on-migrate: true
    placeholders:
      deliveryStatusConstraintUpgrade: >-
        ALTER TABLE delivery_order DROP CONSTRAINT IF EXISTS delivery_order_status_check;
        ALTER TABLE delivery_order DROP CONSTRAINT IF EXISTS ck_delivery_order_status;
        ALTER TABLE delivery_order ADD CONSTRAINT ck_delivery_order_status
        CHECK (status IN ('DRAFT', 'READY_FOR_ASSIGNMENT', 'DELIVERED'));
      podEvidenceUniquenessIndexes: >-
        CREATE UNIQUE INDEX uk_pod_single_signature ON pod_evidence(proof_of_delivery_id)
        WHERE evidence_type = 'SIGNATURE';
        CREATE UNIQUE INDEX uk_pod_single_barcode ON pod_evidence(proof_of_delivery_id)
        WHERE evidence_type = 'BARCODE';
      vehicleReadingSourceIdentityIndex: >-
        CREATE UNIQUE INDEX uq_vehicle_reading_source
        ON vehicle_reading(vehicle_id, reading_type, source_type, source_reference_id)
        WHERE source_reference_id IS NOT NULL AND correction_of_reading_id IS NULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith

security:
  jwt:
    issuer: transport-logistics-modulith
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

app:
  delivery:
    self-service:
      customer-origin: http://localhost:5173
      contact-hmac-secret: test_only_self_service_hmac_secret_2026
      contact-hash-key-version: v1
  dev:
    identity-bootstrap:
      enabled: false
    sample-data:
      enabled: false
  notification:
    sms:
      enabled: false
      mode: disabled
      read-timeout: PT30S
    email:
      enabled: false
      mode: test
      provider: test
      from: noreply@localhost.test
      reply-to:
      connect-timeout: PT5S
      read-timeout: PT30S
      smtp:
        host: localhost
        port: 2525
        tls-mode: none
        authentication-required: false
        username:
        password:
delivery:
  evidence:
    storage-path: ./target/test-delivery-evidence
