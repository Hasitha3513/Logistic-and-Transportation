spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transport_logistics}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
security:
  jwt:
    secret: ${JWT_SECRET}
