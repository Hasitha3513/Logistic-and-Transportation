spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  flyway:
    placeholders:
      vehicleReadingSourceIdentityIndex: >-
        CREATE UNIQUE INDEX uq_vehicle_reading_source
        ON vehicle_reading(vehicle_id, reading_type, source_type, source_reference_id)
        WHERE source_reference_id IS NOT NULL AND correction_of_reading_id IS NULL
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
security:
  jwt:
    secret: ${JWT_SECRET}
app:
  dev:
    identity-bootstrap:
      enabled: ${APP_DEV_IDENTITY_BOOTSTRAP_ENABLED:${DEV_IDENTITY_BOOTSTRAP_ENABLED:false}}
      username: ${APP_DEV_IDENTITY_BOOTSTRAP_USERNAME:${DEV_IDENTITY_USERNAME:admin}}
      password: ${APP_DEV_IDENTITY_BOOTSTRAP_PASSWORD:${DEV_IDENTITY_PASSWORD:}}
      email: ${APP_DEV_IDENTITY_BOOTSTRAP_EMAIL:${DEV_IDENTITY_EMAIL:admin@localhost.test}}
    sample-data:
      enabled: ${APP_DEV_SAMPLE_DATA_ENABLED:${DEV_SAMPLE_DATA_ENABLED:false}}
