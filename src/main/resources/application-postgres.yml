spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
security:
  jwt:
    secret: ${JWT_SECRET}
