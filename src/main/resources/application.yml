spring:
  application:
    name: transport-logistics-modulith
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: postgres
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:transport_logistics}}
    username: ${DB_USERNAME:${POSTGRES_USER:transport_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:transport_app_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 20
        batch.size: 65536
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.request.size: 1048576
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  jpa:
    open-in-view: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    repair-on-migrate: true
    placeholders:
      deliveryStatusConstraintUpgrade: >-
        ALTER TABLE delivery_order DROP CONSTRAINT IF EXISTS delivery_order_status_check;
        ALTER TABLE delivery_order DROP CONSTRAINT IF EXISTS ck_delivery_order_status;
        ALTER TABLE delivery_order ADD CONSTRAINT ck_delivery_order_status
        CHECK (status IN ('DRAFT', 'READY_FOR_ASSIGNMENT', 'DELIVERED'));
      podEvidenceUniquenessIndexes: >-
        CREATE UNIQUE INDEX IF NOT EXISTS uk_pod_single_signature ON pod_evidence(proof_of_delivery_id)
        WHERE evidence_type = 'SIGNATURE';
        CREATE UNIQUE INDEX IF NOT EXISTS uk_pod_single_barcode ON pod_evidence(proof_of_delivery_id)
        WHERE evidence_type = 'BARCODE';
      vehicleReadingSourceIdentityIndex: >-
        CREATE UNIQUE INDEX IF NOT EXISTS uq_vehicle_reading_source
        ON vehicle_reading(vehicle_id, reading_type, source_type, source_reference_id)
        WHERE source_reference_id IS NOT NULL AND correction_of_reading_id IS NULL
      trackingTimescaleSetup: CREATE EXTENSION IF NOT EXISTS timescaledb;
      trackingTimescaleHypertable: >-
        SELECT create_hypertable(
        'tracking_position_history',
        by_range('source_timestamp', INTERVAL '1 day'),
        if_not_exists => TRUE);
      trackingTimescalePolicyHardening: >-
        SELECT set_chunk_time_interval('tracking_position_history', INTERVAL '7 days');
        ALTER TABLE tracking_position_history SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'tenant_id,vehicle_id',
        timescaledb.compress_orderby = 'source_timestamp DESC,id DESC');
        SELECT add_compression_policy(
        'tracking_position_history', INTERVAL '7 days', if_not_exists => TRUE);
        SELECT add_retention_policy(
        'tracking_position_history', INTERVAL '180 days', if_not_exists => TRUE);
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
springdoc:
  swagger-ui:
    path: /swagger-ui.html
security:
  jwt:
    issuer: transport-logistics-modulith
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_bytes_long_for_security_2026}
app:
  tracking:
    kafka:
      topic: ${TRACKING_KAFKA_TOPIC:tracking.telemetry.ingested.v1}
      v2-topic: ${TRACKING_KAFKA_V2_TOPIC:tracking.telemetry.ingested.v2}
      partitions: ${TRACKING_KAFKA_PARTITIONS:6}
      acknowledgement-timeout: ${TRACKING_KAFKA_ACK_TIMEOUT:PT10S}
      manage-topic: ${TRACKING_KAFKA_MANAGE_TOPIC:false}
      live-projector-group: ${TRACKING_KAFKA_LIVE_PROJECTOR_GROUP:tracking-live-projector-v1}
      history-persister-group: ${TRACKING_KAFKA_HISTORY_PERSISTER_GROUP:tracking-telemetry-persister-group}
      dead-letter-topic: ${TRACKING_KAFKA_DLT_TOPIC:tracking.telemetry.ingested.v1.dlt}
      v2-dead-letter-topic: ${TRACKING_KAFKA_V2_DLT_TOPIC:tracking.telemetry.ingested.v2.dlt}
    hybrid-storage:
      enabled: ${TRACKING_HYBRID_STORAGE_ENABLED:false}
      live-state-ttl: ${TRACKING_LIVE_STATE_TTL:PT24H}
      maximum-live-index-size: ${TRACKING_MAXIMUM_LIVE_INDEX_SIZE:10000}
      stream-batch-size: ${TRACKING_STREAM_BATCH_SIZE:500}
      stream-consumer-delay: ${TRACKING_STREAM_CONSUMER_DELAY:PT1S}
  integration:
    exchange:
      enabled: ${INTEGRATION_EXCHANGE_ENABLED:true}
      worker-delay: ${INTEGRATION_EXCHANGE_WORKER_DELAY:PT5S}
    file:
      controlled-sandbox-root: ${INTEGRATION_CONTROLLED_SANDBOX_ROOT:./data/integration-sandbox}
  delivery:
    self-service:
      customer-origin: ${DELIVERY_SELF_SERVICE_CUSTOMER_ORIGIN:http://localhost:5173}
      contact-hmac-secret: ${DELIVERY_SELF_SERVICE_HMAC_SECRET:local_only_self_service_hmac_secret_change_me_2026}
      contact-hash-key-version: ${DELIVERY_SELF_SERVICE_HMAC_KEY_VERSION:v1}
  dev:
    identity-bootstrap:
      enabled: ${APP_DEV_IDENTITY_BOOTSTRAP_ENABLED:${DEV_IDENTITY_BOOTSTRAP_ENABLED:true}}
      username: ${APP_DEV_IDENTITY_BOOTSTRAP_USERNAME:${DEV_IDENTITY_USERNAME:admin}}
      password: ${APP_DEV_IDENTITY_BOOTSTRAP_PASSWORD:${DEV_IDENTITY_PASSWORD:AdminPass!2026}}
      email: ${APP_DEV_IDENTITY_BOOTSTRAP_EMAIL:${DEV_IDENTITY_EMAIL:admin@transport.local}}
    sample-data:
      enabled: ${APP_DEV_SAMPLE_DATA_ENABLED:${DEV_SAMPLE_DATA_ENABLED:true}}
  notification:
    sms:
      enabled: ${NOTIFICATION_SMS_ENABLED:false}
      mode: ${NOTIFICATION_SMS_MODE:disabled}
      read-timeout: ${NOTIFICATION_SMS_READ_TIMEOUT:PT30S}
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      mode: ${NOTIFICATION_EMAIL_MODE:production}
      provider: ${NOTIFICATION_EMAIL_PROVIDER:smtp}
      from: ${NOTIFICATION_EMAIL_FROM:}
      reply-to: ${NOTIFICATION_EMAIL_REPLY_TO:}
      connect-timeout: ${NOTIFICATION_EMAIL_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${NOTIFICATION_EMAIL_READ_TIMEOUT:PT30S}
      smtp:
        host: ${NOTIFICATION_EMAIL_SMTP_HOST:localhost}
        port: ${NOTIFICATION_EMAIL_SMTP_PORT:587}
        tls-mode: ${NOTIFICATION_EMAIL_SMTP_TLS_MODE:starttls}
        authentication-required: ${NOTIFICATION_EMAIL_SMTP_AUTH_REQUIRED:false}
        username: ${NOTIFICATION_EMAIL_SMTP_USERNAME:}
        password: ${NOTIFICATION_EMAIL_SMTP_PASSWORD:}
delivery:
  evidence:
    storage-path: ${DELIVERY_EVIDENCE_STORAGE_PATH:./data/delivery-evidence}
