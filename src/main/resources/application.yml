spring:
  application:
    name: transport-logistics-modulith
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: postgres
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    repair-on-migrate: true
    placeholders:
      deliveryStatusConstraintUpgrade: >-
        ALTER TABLE delivery_order ADD CONSTRAINT ck_delivery_order_status
        CHECK (status IN ('DRAFT', 'READY_FOR_ASSIGNMENT', 'DELIVERED'));
      podEvidenceUniquenessIndexes: >-
        CREATE UNIQUE INDEX uk_pod_single_signature ON pod_evidence(proof_of_delivery_id)
        WHERE evidence_type = 'SIGNATURE';
        CREATE UNIQUE INDEX uk_pod_single_barcode ON pod_evidence(proof_of_delivery_id)
        WHERE evidence_type = 'BARCODE';
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
springdoc:
  swagger-ui:
    path: /swagger-ui.html
security:
  jwt:
    issuer: transport-logistics-modulith
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
app:
  notification:
    email:
      enabled: false
      mode: test
      provider: test
      from: noreply@localhost.test
      reply-to:
      connect-timeout: PT5S
      read-timeout: PT30S
      smtp:
        host: localhost
        port: 2525
        tls-mode: none
        authentication-required: false
        username:
        password:
delivery:
  evidence:
    storage-path: ${DELIVERY_EVIDENCE_STORAGE_PATH:./data/delivery-evidence}
