spring:
  datasource:
    url: jdbc:h2:mem:transport;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    placeholders:
      vehicleReadingSourceIdentityIndex: >-
        CREATE INDEX idx_vehicle_reading_source_identity_h2
        ON vehicle_reading(vehicle_id, reading_type, source_type, source_reference_id)
security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
app:
  dev:
    identity-bootstrap:
      enabled: ${DEV_IDENTITY_BOOTSTRAP_ENABLED:false}
      username: ${DEV_IDENTITY_USERNAME:}
      password: ${DEV_IDENTITY_PASSWORD:}
      email: ${DEV_IDENTITY_EMAIL:local.operator@example.test}
    sample-data:
      enabled: ${DEV_SAMPLE_DATA_ENABLED:false}
