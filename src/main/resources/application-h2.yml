spring:
  datasource:
    url: jdbc:h2:mem:transport;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    placeholders:
      deliveryStatusConstraintUpgrade: >-
        ALTER TABLE delivery_order ADD CONSTRAINT ck_delivery_order_status
        CHECK (status IN ('DRAFT', 'READY_FOR_ASSIGNMENT', 'DELIVERED'));
      podEvidenceUniquenessIndexes: SELECT 1;
      vehicleReadingSourceIdentityIndex: >-
        CREATE INDEX idx_vehicle_reading_source_identity_h2
        ON vehicle_reading(vehicle_id, reading_type, source_type, source_reference_id)
security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
app:
  dev:
    identity-bootstrap:
      enabled: ${DEV_IDENTITY_BOOTSTRAP_ENABLED:false}
      username: ${DEV_IDENTITY_USERNAME:}
      password: ${DEV_IDENTITY_PASSWORD:}
      email: ${DEV_IDENTITY_EMAIL:local.operator@example.test}
    sample-data:
      enabled: ${DEV_SAMPLE_DATA_ENABLED:false}
